# Travis CI Testing file
# This file will be renamed docker-compose.override.yml
# it will override a standard Pheme installation.

services:
  cli:
    build:
      context: .
    volumes:
      - ./:/app
    env_file: pheme.env
    command: /bin/true
  web:
    volumes:
      - ./tests/resources/:/var/pheme/init_music
